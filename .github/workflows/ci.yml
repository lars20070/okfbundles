name: Check OKF bundles

on:
  push:
    paths:
      - "okf/**"
      - "Makefile"
      - ".github/workflows/check-okf.yml"
  pull_request:
    paths:
      - "okf/**"
      - "Makefile"
      - ".github/workflows/check-okf.yml"

permissions:
  contents: read

jobs:
  check-okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make check-okf
